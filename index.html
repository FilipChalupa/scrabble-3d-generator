<!doctype html>
<html lang="cs">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Scrabble 3D generátor</title>
		<meta name="description" content="Generátor kamenů do hry Scrabble pro 3D tisk – STL a 3MF přímo v prohlížeči." />
		<link rel="icon" href="icons/icon.svg" />
		<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
		<link rel="manifest" href="manifest.webmanifest" />
		<meta name="theme-color" content="#f6f2ea" />
		<link rel="stylesheet" href="style.css" />
		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
					"opentype.js": "https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.module.js",
					"fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js",
					"polygon-clipping": "https://cdn.jsdelivr.net/npm/polygon-clipping@0.15.7/+esm"
				}
			}
		</script>
		<script
			type="module"
			src="src/main.js"
			onerror="document.getElementById('status').textContent = 'Nepodařilo se načíst knihovny. Zkontrolujte připojení k internetu a obnovte stránku.'"
		></script>
		<script>
			if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js')
		</script>
	</head>
	<body>
		<header class="topbar">
			<h1><span class="logo" aria-hidden="true">Ř<sub>4</sub></span> Scrabble 3D generátor</h1>
			<a class="gh" href="https://github.com/FilipChalupa/scrabble-3d-generator" target="_blank" rel="noopener">GitHub</a>
		</header>

		<main class="layout">
			<form id="settings" class="panel" autocomplete="off">
				<!-- vyplní main.js -->
			</form>

			<section class="stage">
				<div class="viewer-wrap">
					<div id="viewer"></div>
					<div class="viewer-tools">
						<div class="seg" role="tablist">
							<button type="button" data-view="tile" class="active">Kámen</button>
							<button type="button" data-view="plate">Podložka</button>
						</div>
						<select id="plate-select" hidden></select>
					</div>
					<div id="status" class="status" aria-live="polite"></div>
				</div>

				<div class="tiles-head">
					<h2>Kameny</h2>
					<span id="summary"></span>
				</div>
				<div id="tile-list" class="tile-list"></div>

				<div class="actions">
					<button type="button" id="dl-tile" class="btn">Stáhnout vybraný kámen</button>
					<button type="button" id="dl-set" class="btn primary">Stáhnout celou sadu (ZIP)</button>
				</div>
				<h2 class="tips-title">Tipy pro tisk</h2>
				<ul class="tips" id="hint"></ul>
			</section>
		</main>
	</body>
</html>
